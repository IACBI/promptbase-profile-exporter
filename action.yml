name: PromptBase Profile Exporter
description: Export public PromptBase profile prompt catalogs from GitHub Actions.
author: PromptBase Profile Exporter contributors

branding:
  icon: download-cloud
  color: blue

inputs:
  profile-url:
    description: >-
      PromptBase profile URL, path, username, or @username. Separate several
      profiles with commas, spaces, or new lines to export each of them.
    required: true
  mode:
    description: Export mode. Use split, all, text, image, text-only, or image-only.
    required: false
    default: split
  format:
    description: >-
      Output format: txt, markdown, json, csv, or html. Empty means txt, or the
      format inferred from output-file / update-file. With update-file, it must
      match that file's extension.
    required: false
    default: ""
  output-dir:
    description: Directory where export files will be written.
    required: false
    default: exports
  sort:
    description: Sort order. Use newest, oldest, title, price, views, sales, downloads, favorites, or rating.
    required: false
    default: newest
  domain:
    description: Optional comma-separated domain filter, for example text,image,video.
    required: false
    default: ""
  type:
    description: Optional comma-separated PromptBase type filter, for example gpt,claude.
    required: false
    default: ""
  price-mode:
    description: Optional price filter. Use free, paid, or leave empty for all prices.
    required: false
    default: ""
  min-price:
    description: Optional minimum price.
    required: false
    default: ""
  max-price:
    description: Optional maximum price.
    required: false
    default: ""
  limit:
    description: Optional maximum number of prompts after filtering and sorting.
    required: false
    default: ""
  since:
    description: Optional inclusive created-date filter, for example 2026-01-01.
    required: false
    default: ""
  until:
    description: Optional inclusive created-date filter, for example 2026-12-31.
    required: false
    default: ""
  min-sales:
    description: Optional minimum number of sales.
    required: false
    default: ""
  min-rating:
    description: Optional minimum rating.
    required: false
    default: ""
  output-file:
    description: Optional exact path for a single catalog. Requires mode all, text, or image.
    required: false
    default: ""
  overwrite:
    description: Allow output-file to replace an existing file.
    required: false
    default: "false"
  update-file:
    description: >-
      Optional existing catalog to compare against and rewrite in place.
      Requires mode all, text, or image.
    required: false
    default: ""
  csv-safe:
    description: Protect CSV text cells from spreadsheet formula injection. Requires csv output.
    required: false
    default: "false"
  compare-csv-safe:
    description: >-
      The CSV compare / update-file catalog was written with csv-safe; restore
      its escaped cells when comparing.
    required: false
    default: "false"
  dry-run:
    description: Fetch, filter, and validate without writing files. Skips the artifact upload.
    required: false
    default: "false"
  compare:
    description: Optional existing catalog path to compare against.
    required: false
    default: ""
  diff-output:
    description: >-
      Optional path where the comparison report should be written (JSON for a
      .json path, Markdown otherwise).
    required: false
    default: ""
  fail-on-diff:
    description: Exit with code 2 when compare finds changes.
    required: false
    default: "false"
  timestamp-filenames:
    description: Append a YYYYMMDD_HHMMSS timestamp to generated filenames.
    required: false
    default: "false"
  allow-missing-descriptions:
    description: Write files even if one or more prompt descriptions are missing.
    required: false
    default: "false"
  python-version:
    description: Python version used to run the exporter.
    required: false
    default: "3.12"
  working-directory:
    description: Directory where the export command should run.
    required: false
    default: "."
  upload-artifact:
    description: Upload the output directory as a workflow artifact.
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact.
    required: false
    default: promptbase-exports

outputs:
  output-dir:
    description: Directory containing generated export files.
    value: ${{ inputs.output-dir }}
  artifact-name:
    description: Uploaded artifact name when upload-artifact is true.
    value: ${{ inputs.artifact-name }}
  exit-code:
    description: Exit code of the exporter (0 ok, 1 error, 2 fail-on-diff found changes).
    value: ${{ steps.export.outputs.exit-code }}
  has-changes:
    description: With compare or update-file, "true" when the catalog changed, else "false".
    value: ${{ steps.export.outputs.has-changes }}
  added:
    description: With compare or update-file, the number of added prompts.
    value: ${{ steps.export.outputs.added }}
  removed:
    description: With compare or update-file, the number of removed prompts.
    value: ${{ steps.export.outputs.removed }}
  changed:
    description: With compare or update-file, the number of changed prompts.
    value: ${{ steps.export.outputs.changed }}
  unchanged:
    description: With compare or update-file, the number of unchanged prompts.
    value: ${{ steps.export.outputs.unchanged }}
  diff-json:
    description: With compare or update-file, path of the machine-readable JSON diff report.
    value: ${{ steps.export.outputs.diff-json }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install exporter
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        python -m pip install "$GITHUB_ACTION_PATH"

    - name: Validate action inputs
      id: action-inputs
      shell: bash
      env:
        UPLOAD_ARTIFACT: ${{ inputs.upload-artifact }}
        DRY_RUN: ${{ inputs.dry-run }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        UPDATE_FILE: ${{ inputs.update-file }}
      run: |
        set -euo pipefail

        normalize_bool() {
          printf '%s' "$1" | tr '[:upper:]' '[:lower:]'
        }

        case "$(normalize_bool "$UPLOAD_ARTIFACT")" in
          true|"")
            upload_artifact=true
            ;;
          false)
            upload_artifact=false
            ;;
          *)
            echo "::error::upload-artifact must be true or false."
            exit 1
            ;;
        esac

        # A dry run writes nothing, so there is nothing to upload.
        if [[ "$(normalize_bool "$DRY_RUN")" == "true" ]]; then
          upload_artifact=false
        fi
        echo "upload_artifact=$upload_artifact" >> "$GITHUB_OUTPUT"

        # Single-file modes write outside output-dir; upload what was written.
        if [[ -n "$UPDATE_FILE" ]]; then
          target="$UPDATE_FILE"
        elif [[ -n "$OUTPUT_FILE" ]]; then
          target="$OUTPUT_FILE"
        else
          target="$OUTPUT_DIR"
        fi

        if [[ "$target" = /* ]]; then
          artifact_path="$target"
        elif [[ "$WORKING_DIRECTORY" = "." || -z "$WORKING_DIRECTORY" ]]; then
          artifact_path="$target"
        else
          artifact_path="${WORKING_DIRECTORY%/}/${target#./}"
        fi

        echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"

    - name: Export PromptBase profile
      id: export
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PROFILE_URL: ${{ inputs.profile-url }}
        MODE: ${{ inputs.mode }}
        FORMAT: ${{ inputs.format }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        SORT: ${{ inputs.sort }}
        DOMAIN: ${{ inputs.domain }}
        PROMPT_TYPE: ${{ inputs.type }}
        PRICE_MODE: ${{ inputs.price-mode }}
        MIN_PRICE: ${{ inputs.min-price }}
        MAX_PRICE: ${{ inputs.max-price }}
        MIN_SALES: ${{ inputs.min-sales }}
        MIN_RATING: ${{ inputs.min-rating }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        OVERWRITE: ${{ inputs.overwrite }}
        UPDATE_FILE: ${{ inputs.update-file }}
        CSV_SAFE: ${{ inputs.csv-safe }}
        COMPARE_CSV_SAFE: ${{ inputs.compare-csv-safe }}
        DRY_RUN: ${{ inputs.dry-run }}
        LIMIT: ${{ inputs.limit }}
        SINCE: ${{ inputs.since }}
        UNTIL: ${{ inputs.until }}
        COMPARE: ${{ inputs.compare }}
        DIFF_OUTPUT: ${{ inputs.diff-output }}
        FAIL_ON_DIFF: ${{ inputs.fail-on-diff }}
        TIMESTAMP_FILENAMES: ${{ inputs.timestamp-filenames }}
        ALLOW_MISSING_DESCRIPTIONS: ${{ inputs.allow-missing-descriptions }}
      run: |
        set -euo pipefail

        normalize_bool() {
          printf '%s' "$1" | tr '[:upper:]' '[:lower:]'
        }

        add_flag() {
          # add_flag <input-name> <value> <cli-flag>
          case "$(normalize_bool "$2")" in
            true)
              args+=("$3")
              ;;
            false|"")
              ;;
            *)
              echo "::error::$1 must be true or false."
              exit 1
              ;;
          esac
        }

        # A read loop rather than mapfile, which Bash 3.2 (macOS) lacks.
        profiles=()
        while IFS= read -r profile; do
          if [[ -n "$profile" ]]; then
            profiles+=("$profile")
          fi
        done < <(printf '%s\n' "$PROFILE_URL" | tr ',' '\n' | tr -s '[:space:]' '\n')
        if [[ ${#profiles[@]} -eq 0 ]]; then
          echo "::error::profile-url is required."
          exit 1
        fi

        args=(
          "${profiles[@]}"
          "--mode" "$MODE"
          "--output-dir" "$OUTPUT_DIR"
          "--sort" "$SORT"
        )

        if [[ -n "$FORMAT" ]]; then
          args+=("--format" "$FORMAT")
        fi

        if [[ -n "$DOMAIN" ]]; then
          args+=("--domain" "$DOMAIN")
        fi

        if [[ -n "$PROMPT_TYPE" ]]; then
          args+=("--type" "$PROMPT_TYPE")
        fi

        case "$(normalize_bool "$PRICE_MODE")" in
          "")
            ;;
          free)
            args+=("--free-only")
            ;;
          paid)
            args+=("--paid-only")
            ;;
          *)
            echo "::error::price-mode must be empty, free, or paid."
            exit 1
            ;;
        esac

        if [[ -n "$MIN_PRICE" ]]; then
          args+=("--min-price" "$MIN_PRICE")
        fi

        if [[ -n "$MAX_PRICE" ]]; then
          args+=("--max-price" "$MAX_PRICE")
        fi

        if [[ -n "$MIN_SALES" ]]; then
          args+=("--min-sales" "$MIN_SALES")
        fi

        if [[ -n "$MIN_RATING" ]]; then
          args+=("--min-rating" "$MIN_RATING")
        fi

        if [[ -n "$LIMIT" ]]; then
          args+=("--limit" "$LIMIT")
        fi

        if [[ -n "$OUTPUT_FILE" ]]; then
          args+=("--output-file" "$OUTPUT_FILE")
        fi

        if [[ -n "$UPDATE_FILE" ]]; then
          args+=("--update-file" "$UPDATE_FILE")
        fi

        if [[ -n "$SINCE" ]]; then
          args+=("--since" "$SINCE")
        fi

        if [[ -n "$UNTIL" ]]; then
          args+=("--until" "$UNTIL")
        fi

        if [[ -n "$COMPARE" ]]; then
          args+=("--compare" "$COMPARE")
        fi

        if [[ -n "$DIFF_OUTPUT" ]]; then
          args+=("--diff-output" "$DIFF_OUTPUT")
        fi

        add_flag fail-on-diff "$FAIL_ON_DIFF" --fail-on-diff
        add_flag timestamp-filenames "$TIMESTAMP_FILENAMES" --timestamp-filenames
        add_flag allow-missing-descriptions "$ALLOW_MISSING_DESCRIPTIONS" \
          --allow-missing-descriptions
        add_flag overwrite "$OVERWRITE" --overwrite
        add_flag csv-safe "$CSV_SAFE" --csv-safe
        add_flag compare-csv-safe "$COMPARE_CSV_SAFE" --compare-csv-safe
        add_flag dry-run "$DRY_RUN" --dry-run

        # Always capture a machine-readable diff so its counts become outputs.
        diff_json=""
        if [[ -n "$COMPARE" || -n "$UPDATE_FILE" ]]; then
          diff_json="$RUNNER_TEMP/promptbase-diff-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$$.json"
          args+=("--diff-output" "$diff_json")
        fi

        set +e
        promptbase-export "${args[@]}"
        status=$?
        set -e

        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        if [[ -n "$diff_json" && -f "$diff_json" ]]; then
          python - "$diff_json" >> "$GITHUB_OUTPUT" <<'PY'
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            report = json.load(handle)
        print(f"has-changes={'true' if report['has_changes'] else 'false'}")
        for key, value in report["summary"].items():
            print(f"{key}={value}")
        print(f"diff-json={sys.argv[1]}")
        PY
        fi
        exit "$status"

    - name: Upload exports
      if: ${{ steps.action-inputs.outputs.upload_artifact == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.action-inputs.outputs.artifact_path }}
        if-no-files-found: error
