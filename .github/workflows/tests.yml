name: tests

# Only pushes to main and pull requests: a push to a branch with an open pull
# request used to run the whole suite twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m coverage run -m unittest discover -s tests
      - run: python -m coverage report
      # The default output directory is relative; a test that forgets to set one
      # would leave it in the checkout. Every module that runs a command has a guard.
      - run: test ! -e exports
      - run: python -m promptbase_exporter --version
      - run: python -m promptbase_exporter --help
      - run: promptbase-export-web --version
      - run: promptbase-diff --version
      - run: promptbase-convert --version

  # Platforms beyond the required Ubuntu matrix above. The web UI has
  # Windows-specific path handling (UNC paths), and Windows and macOS are where
  # most desktop users run the CLI, so they get the suite on the oldest and
  # newest supported Python. Kept as a separate job so the required check names
  # above stay unchanged.
  unittest-os:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests
      - run: python -m promptbase_exporter --version

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*

  # End-to-end run of the composite action against live public data: an
  # export, then an in-place update that must report no changes, then a
  # multi-profile dry run (which must not try to upload an artifact).
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./
        with:
          profile-url: "@acb"
          mode: all
          format: json
          output-dir: ci-exports
          upload-artifact: false
      - id: update
        uses: ./
        with:
          profile-url: "@acb"
          mode: all
          update-file: ci-exports/acb_all_prompts.json
          fail-on-diff: true
          upload-artifact: false
      - name: Check update outputs
        env:
          EXIT_CODE: ${{ steps.update.outputs.exit-code }}
          HAS_CHANGES: ${{ steps.update.outputs.has-changes }}
          UNCHANGED: ${{ steps.update.outputs.unchanged }}
          DIFF_JSON: ${{ steps.update.outputs.diff-json }}
        run: |
          set -euo pipefail
          test "$EXIT_CODE" = 0
          test "$HAS_CHANGES" = false
          test "$UNCHANGED" -gt 0
          python -c "import json, sys; assert json.load(open(sys.argv[1]))['has_changes'] is False" "$DIFF_JSON"
      - uses: ./
        with:
          profile-url: |
            @acb
            emanema
          dry-run: true

  # macOS ships Bash 3.2 as /bin/bash: run the action there, and run its
  # export script under that exact shell, so Bash 4-only syntax cannot return.
  action-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./
        with:
          profile-url: "@acb, emanema"
          dry-run: true
      - name: Run the export step under /bin/bash 3.2
        run: |
          set -euo pipefail
          /bin/bash --version | head -1
          python3 - <<'PY'
          import re
          import textwrap
          from pathlib import Path

          text = Path("action.yml").read_text(encoding="utf-8")
          script = textwrap.dedent(re.findall(r"\n      run: \|\n((?:        .*\n|\n)+)", text)[2])
          # Default every env var the export step declares to empty, as the
          # runner does for an unset input, so a new input cannot trip set -u
          # here while the real action is fine.
          env_block = text[text.index("id: export"):].split("\n      run: |")[0]
          names = re.findall(r"\n        ([A-Z_]+): ", env_block)
          prelude = "".join(': "${' + name + ':=}"\n' for name in names)
          Path("export-step.sh").write_text(prelude + script, encoding="utf-8")
          PY
          mkdir -p stub
          printf '#!/bin/sh\nprintf "%%s\n" "$@"\n' > stub/promptbase-export
          chmod +x stub/promptbase-export
          out=$(env PATH="$PWD/stub:$PATH" GITHUB_OUTPUT=/dev/null RUNNER_TEMP="$RUNNER_TEMP" \
            PROFILE_URL=$'@acb, emanema\n  @other' MODE=all FORMAT= OUTPUT_DIR=exports SORT=newest \
            DOMAIN= PROMPT_TYPE= PRICE_MODE= MIN_PRICE= MAX_PRICE= MIN_SALES= MIN_RATING= \
            OUTPUT_FILE= OVERWRITE=false UPDATE_FILE= CSV_SAFE=false DRY_RUN=true LIMIT= \
            SINCE= UNTIL= COMPARE= DIFF_OUTPUT= FAIL_ON_DIFF=false TIMESTAMP_FILENAMES=false \
            ALLOW_MISSING_DESCRIPTIONS=false /bin/bash export-step.sh)
          echo "$out"
          test "$(echo "$out" | head -3 | tr '\n' ' ')" = "@acb emanema @other "
