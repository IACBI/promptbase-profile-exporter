name: canary

# A nightly smoke test against live PromptBase data. The pull-request checks run
# the same export, but only when someone pushes: this notices a change on the
# PromptBase side (a renamed field, an outage, new rate limiting) within a day
# and opens an issue instead of failing the next unrelated pull request.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The exporter has no dependencies to install.
      - run: python -m pip install --no-deps -e .
      - name: Export, then update in place and expect no changes
        run: |
          set -euo pipefail
          promptbase-export @acb --mode all --dry-run
          promptbase-export @acb --mode all --format json --output-file "$RUNNER_TEMP/acb.json"
          promptbase-export @acb --mode all --update-file "$RUNNER_TEMP/acb.json" --fail-on-diff --quiet
      - name: Record two history snapshots and report on them
        run: |
          set -euo pipefail
          db="$RUNNER_TEMP/history.sqlite"
          promptbase-history snapshot @acb --db "$db" --quiet
          promptbase-history snapshot @acb --db "$db" --quiet
          promptbase-history report --db "$db" --format json > "$RUNNER_TEMP/trend.json"
          python - "$RUNNER_TEMP/trend.json" <<'PY'
          import json
          import sys

          listings = json.load(open(sys.argv[1], encoding="utf-8"))["totals"]["listings"]
          assert listings["after"] > 0, listings
          PY
      # The token reaches only the two steps that call gh, not the install and
      # export steps before them.
      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_TITLE: "Canary: live PromptBase export is failing"
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" \
            --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "Still failing: $run_url"
          else
            gh issue create --title "$ISSUE_TITLE" \
              --body "The scheduled live export failed: $run_url"
          fi
      - name: Close the issue once it passes again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_TITLE: "Canary: live PromptBase export is failing"
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" \
            --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue close "$number" --comment "Passing again: $run_url"
          fi
