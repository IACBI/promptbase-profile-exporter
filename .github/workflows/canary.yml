name: canary

# A nightly smoke test against live PromptBase data. The pull-request checks run
# the same export, but only when someone pushes: this notices a change on the
# PromptBase side (a renamed field, an outage, new rate limiting) within a day
# and opens an issue instead of failing the next unrelated pull request.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: "Canary: live PromptBase export is failing"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Export, then update in place and expect no changes
        run: |
          set -euo pipefail
          promptbase-export @acb --mode all --dry-run
          promptbase-export @acb --mode all --format json --output-file "$RUNNER_TEMP/acb.json"
          promptbase-export @acb --mode all --update-file "$RUNNER_TEMP/acb.json" --fail-on-diff --quiet
      - name: Report the failure
        if: failure()
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title"             --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "Still failing: $run_url"
          else
            gh issue create --title "$ISSUE_TITLE"               --body "The scheduled live export failed: $run_url"
          fi
      - name: Close the issue once it passes again
        if: success()
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title"             --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue close "$number" --comment "Passing again: $run_url"
          fi
