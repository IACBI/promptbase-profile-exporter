name: release

# Builds the published release's sdist and wheel from its tag, attests where they
# were built (SLSA build provenance, signed through Sigstore), and attaches them to
# the release. There is no PyPI package; this gives a downloadable, verifiable build:
#   gh attestation verify promptbase_profile_exporter-X.Y.Z-py3-none-any.whl \
#     --repo IACBI/promptbase-profile-exporter

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach the files to the release
      id-token: write  # request the Sigstore signing certificate
      attestations: write  # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-release.txt
      - name: Build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python -m build
          python -m twine check dist/*
          # The files must be this tag's version, not whatever the tag points near.
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v$version" = "$TAG"
          ls dist/*"$version"*
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: dist/*
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # The signed Sigstore bundle goes next to the files it covers, so it can be
          # checked offline too (gh attestation verify FILE --bundle BUNDLE ...).
          cp "$BUNDLE" "dist/promptbase_profile_exporter-${TAG#v}.sigstore.json"
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
